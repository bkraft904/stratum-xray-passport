name: Deploy Backend to AWS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2

      - name: Debug OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            console.log('aud:', JSON.stringify(payload.aud));
            console.log('sub:', JSON.stringify(payload.sub));
            console.log('iss:', JSON.stringify(payload.iss));
            console.log('repository:', JSON.stringify(payload.repository));
            console.log('ref:', JSON.stringify(payload.ref));
            console.log('event_name:', JSON.stringify(payload.event_name));

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: sam build
        working-directory: backend
        run: sam build

      - name: sam deploy
        working-directory: backend
        run: |
          sam deploy \
            --stack-name stratum-scan-lab \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides AnthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }} AllowedOrigin=https://bkraft904.github.io

      - name: Print API URL
        working-directory: backend
        run: |
          aws cloudformation describe-stacks --stack-name stratum-scan-lab \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text
