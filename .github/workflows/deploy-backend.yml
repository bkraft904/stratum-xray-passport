name: Deploy Backend to AWS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: sam build
        working-directory: backend
        run: sam build

      - name: sam deploy
        working-directory: backend
        run: |
          sam deploy \
            --stack-name stratum-scan-lab \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides AnthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }} AllowedOrigin=https://bkraft904.github.io JwtSecret=${{ secrets.JWT_SECRET }} FromEmail=${{ vars.VAULT_FROM_EMAIL }} StripeSecretKey=${{ secrets.STRIPE_SECRET_KEY }} StripeWebhookSecret=${{ secrets.STRIPE_WEBHOOK_SECRET }}

      - name: Print API URLs
        working-directory: backend
        run: |
          aws cloudformation describe-stacks --stack-name stratum-scan-lab \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text
          aws cloudformation describe-stacks --stack-name stratum-scan-lab \
            --query "Stacks[0].Outputs[?OutputKey=='VaultApiUrl'].OutputValue" --output text
