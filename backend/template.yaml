AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Stratum Scan Lab backend — a single Lambda function that sends uploaded
  frames to Claude's vision API and returns real, grounded findings about
  visible construction elements.

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Your Anthropic API key (from console.anthropic.com). Stored as a Lambda environment variable.
  AllowedOrigin:
    Type: String
    Default: "https://bkraft904.github.io"
    Description: Origin allowed to call this API (your deployed site's URL, no trailing slash).
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Random secret used to sign Vault session tokens. Generate with `openssl rand -hex 32`.
  FromEmail:
    Type: String
    Description: Verified SES sender address for magic-link sign-in emails (must be verified in SES first).
  AppUrl:
    Type: String
    Default: "https://bkraft904.github.io/stratum-xray-passport"
    Description: Base URL of the deployed site — used to build the magic-link sign-in URL.
  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Stripe secret key (sk_...) for creating Checkout Sessions. Leave blank until Stripe is set up — checkout/webhook simply won't work yet.
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Signing secret (whsec_...) for the Stripe webhook endpoint. Only obtainable after creating the webhook in the Stripe dashboard, which needs this stack's URL first — so this is set in a follow-up deploy.

Resources:
  ScanLabHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
          - "http://localhost:5173"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
      # Baseline protection against runaway cost from a script or scraper —
      # /analyze and /auth/request-link are unauthenticated and each call
      # costs real money (Anthropic tokens, SES sends). 5 req/s steady
      # state, bursts up to 10, shared across all routes on this API.
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: analyze/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures:
        - arm64
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        Analyze:
          Type: HttpApi
          Properties:
            ApiId: !Ref ScanLabHttpApi
            Path: /analyze
            Method: POST

  # ---------------------------------------------------------------------
  # Vault: the persistence/ownership layer. Everything below turns the
  # one-shot Scan Lab analysis into a property-owned, accumulating record.
  # ---------------------------------------------------------------------

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  LoginTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-login-tokens"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  PropertiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-properties"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: propertyId
          AttributeType: S
        - AttributeName: ownerEmail
          AttributeType: S
      KeySchema:
        - AttributeName: propertyId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ownerEmail-index
          KeySchema:
            - AttributeName: ownerEmail
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ScansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-scans"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: propertyId
          AttributeType: S
        - AttributeName: scanId
          AttributeType: S
      KeySchema:
        - AttributeName: propertyId
          KeyType: HASH
        - AttributeName: scanId
          KeyType: RANGE

  TransferTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-transfer-tokens"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-subscriptions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  VaultAuthRequestLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-auth-request-link/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
          LOGIN_TOKENS_TABLE: !Ref LoginTokensTable
          PROPERTIES_TABLE: !Ref PropertiesTable
          SCANS_TABLE: !Ref ScansTable
          FROM_EMAIL: !Ref FromEmail
          APP_URL: !Ref AppUrl
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref LoginTokensTable }
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: "*"
      Events:
        RequestLink:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: /auth/request-link, Method: POST }

  VaultAuthVerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-auth-verify/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
          LOGIN_TOKENS_TABLE: !Ref LoginTokensTable
          PROPERTIES_TABLE: !Ref PropertiesTable
          SCANS_TABLE: !Ref ScansTable
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref LoginTokensTable }
        - DynamoDBWritePolicy: { TableName: !Ref UsersTable }
      Events:
        Verify:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: /auth/verify, Method: GET }

  VaultPropertiesCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-properties-create/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
          LOGIN_TOKENS_TABLE: !Ref LoginTokensTable
          PROPERTIES_TABLE: !Ref PropertiesTable
          SCANS_TABLE: !Ref ScansTable
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref PropertiesTable }
      Events:
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: /properties, Method: POST }

  VaultPropertiesListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-properties-list/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
          LOGIN_TOKENS_TABLE: !Ref LoginTokensTable
          PROPERTIES_TABLE: !Ref PropertiesTable
          SCANS_TABLE: !Ref ScansTable
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PropertiesTable }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: /properties, Method: GET }

  VaultPropertiesGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-properties-get/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
          LOGIN_TOKENS_TABLE: !Ref LoginTokensTable
          PROPERTIES_TABLE: !Ref PropertiesTable
          SCANS_TABLE: !Ref ScansTable
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PropertiesTable }
        - DynamoDBReadPolicy: { TableName: !Ref ScansTable }
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/properties/{id}", Method: GET }

  VaultScansCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-scans-create/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
          LOGIN_TOKENS_TABLE: !Ref LoginTokensTable
          PROPERTIES_TABLE: !Ref PropertiesTable
          SCANS_TABLE: !Ref ScansTable
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PropertiesTable }
        - DynamoDBWritePolicy: { TableName: !Ref ScansTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SubscriptionsTable }
      Events:
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/properties/{id}/scans", Method: POST }

  VaultReportGenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-report-generate/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
          LOGIN_TOKENS_TABLE: !Ref LoginTokensTable
          PROPERTIES_TABLE: !Ref PropertiesTable
          SCANS_TABLE: !Ref ScansTable
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PropertiesTable }
        - DynamoDBReadPolicy: { TableName: !Ref ScansTable }
      Events:
        Report:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/properties/{id}/report", Method: GET }

  VaultAskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-ask/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
          LOGIN_TOKENS_TABLE: !Ref LoginTokensTable
          PROPERTIES_TABLE: !Ref PropertiesTable
          SCANS_TABLE: !Ref ScansTable
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PropertiesTable }
        - DynamoDBReadPolicy: { TableName: !Ref ScansTable }
      Events:
        Ask:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/properties/{id}/ask", Method: POST }

  VaultTransferRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-transfer-request/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
          LOGIN_TOKENS_TABLE: !Ref LoginTokensTable
          PROPERTIES_TABLE: !Ref PropertiesTable
          SCANS_TABLE: !Ref ScansTable
          TRANSFER_TOKENS_TABLE: !Ref TransferTokensTable
          FROM_EMAIL: !Ref FromEmail
          APP_URL: !Ref AppUrl
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PropertiesTable }
        - DynamoDBWritePolicy: { TableName: !Ref TransferTokensTable }
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: "*"
      Events:
        Transfer:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/properties/{id}/transfer", Method: POST }

  VaultTransferAcceptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-transfer-accept/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
          LOGIN_TOKENS_TABLE: !Ref LoginTokensTable
          PROPERTIES_TABLE: !Ref PropertiesTable
          SCANS_TABLE: !Ref ScansTable
          TRANSFER_TOKENS_TABLE: !Ref TransferTokensTable
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TransferTokensTable }
        - DynamoDBCrudPolicy: { TableName: !Ref PropertiesTable }
        - DynamoDBWritePolicy: { TableName: !Ref UsersTable }
      Events:
        TransferAccept:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/transfer/accept", Method: GET }

  VaultShareToggleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-share-toggle/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
          LOGIN_TOKENS_TABLE: !Ref LoginTokensTable
          PROPERTIES_TABLE: !Ref PropertiesTable
          SCANS_TABLE: !Ref ScansTable
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PropertiesTable }
      Events:
        Share:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/properties/{id}/share", Method: POST }

  VaultPublicPropertyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-public-property/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
          LOGIN_TOKENS_TABLE: !Ref LoginTokensTable
          PROPERTIES_TABLE: !Ref PropertiesTable
          SCANS_TABLE: !Ref ScansTable
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PropertiesTable }
        - DynamoDBReadPolicy: { TableName: !Ref ScansTable }
      Events:
        PublicView:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/properties/{id}/public", Method: GET }

  VaultCheckoutCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-checkout-create/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
          LOGIN_TOKENS_TABLE: !Ref LoginTokensTable
          PROPERTIES_TABLE: !Ref PropertiesTable
          SCANS_TABLE: !Ref ScansTable
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          APP_URL: !Ref AppUrl
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PropertiesTable }
      Events:
        Checkout:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/properties/{id}/checkout", Method: POST }

  VaultStripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-stripe-webhook/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          PROPERTIES_TABLE: !Ref PropertiesTable
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref PropertiesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SubscriptionsTable }
      Events:
        Webhook:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/stripe/webhook", Method: POST }

  VaultAccountGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-account-get/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref UsersTable }
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/account", Method: GET }

  VaultAccountUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-account-update/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          USERS_TABLE: !Ref UsersTable
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
      Events:
        Update:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/account", Method: POST }

  VaultSubscriptionCheckoutCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-subscription-checkout-create/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          APP_URL: !Ref AppUrl
      Events:
        Checkout:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/subscription/checkout", Method: POST }

  VaultSubscriptionStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-subscription-status/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SubscriptionsTable }
      Events:
        Status:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/subscription", Method: GET }

  VaultSubscriptionPortalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: vault-subscription-portal/
      Handler: index.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          APP_URL: !Ref AppUrl
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SubscriptionsTable }
      Events:
        Portal:
          Type: HttpApi
          Properties: { ApiId: !Ref ScanLabHttpApi, Path: "/subscription/portal", Method: POST }

Outputs:
  ApiUrl:
    Description: Invoke URL for the analyze endpoint — set this as VITE_ANALYZE_API_URL
    Value: !Sub "https://${ScanLabHttpApi}.execute-api.${AWS::Region}.amazonaws.com/analyze"
  VaultApiUrl:
    Description: Base URL for the Vault endpoints (append /properties, /auth/request-link, etc.)
    Value: !Sub "https://${ScanLabHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
